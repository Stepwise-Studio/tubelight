[project]
name = "tubelight-driver"
version = "0.1.0"
description = "Computer use for Linux (GNOME): agents read and use apps in the background and arrange windows across monitors, over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []  # the system's PyGObject (python3-gi) and AT-SPI, nothing from PyPI

[project.scripts]
tubelight-driver = "tubelight_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tubelight_driver.py", "tubelight_mcp.py", "tubelight-windows.js", "tubelight-windows.json"]
